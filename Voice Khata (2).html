<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F5;--card:#FFFFFF;--tx:#12302A;--mut:#5E706A;--bd:#E1E8E5;--gold:#F2A900;--ink:#12302A;--on-ink:#F4F6F5;--cr:#C8472B;--pay:#1F8A57;--field:#F4F6F5;--sh:0 1px 2px rgba(18,48,42,.06),0 10px 28px rgba(18,48,42,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1613;--card:#14231E;--tx:#E8F0ED;--mut:#98ADA6;--bd:#243832;--ink:#1C332C;--on-ink:#E8F0ED;--cr:#F07A5C;--pay:#4FBF86;--field:#0B1613;--sh:0 10px 28px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1613;--card:#14231E;--tx:#E8F0ED;--mut:#98ADA6;--bd:#243832;--ink:#1C332C;--on-ink:#E8F0ED;--cr:#F07A5C;--pay:#4FBF86;--field:#0B1613;--sh:0 10px 28px rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{flex:none;display:flex;align-items:center;gap:12px;width:100%;max-width:600px;margin:0 auto;padding:12px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.slogan{font-size:13px;color:var(--mut)}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
select{appearance:none;-webkit-appearance:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:14px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .15s,opacity .2s}
.icon:active{transform:scale(.92)}.icon.off{opacity:.45}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:600px;margin:0 auto;padding:4px 16px 28px}
.hero{background:var(--ink);color:var(--on-ink);border-radius:24px;padding:20px 20px 16px;box-shadow:var(--sh)}
.hl{font-size:14px;opacity:.72;font-weight:600}
.big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.two span{display:block;font-size:13px;opacity:.7}.two b{font-size:18px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px;gap:10px}
.sec h2{margin:0;font-size:16px;font-weight:800}.sec h2 small{color:var(--mut);font-weight:600;margin-left:6px}
.try{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.try::-webkit-scrollbar{display:none}
.try button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,border-color .2s}
.try button:active{transform:scale(.96)}.try button:hover{border-color:var(--gold)}
.btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.list{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--bd);color:inherit;font:inherit;text-align:left}
.row:last-child{border-bottom:0}
button.row{cursor:pointer;transition:background .15s}button.row:active{background:var(--field)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.nm{flex:1;min-width:0;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.nm em{font-style:normal;font-size:12px;font-weight:600;color:var(--mut);background:var(--field);border:1px solid var(--bd);border-radius:999px;padding:1px 9px}
.nm small{flex-basis:100%;color:var(--mut);font-size:13px;font-weight:500}
.amt{text-align:right;display:flex;flex-direction:column}.amt b{font-size:17px}.amt small{color:var(--mut);font-size:12px}
.cr{color:var(--cr)}.pay{color:var(--pay)}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic.cr{background:color-mix(in srgb,var(--cr) 14%,transparent)}.ic.pay{background:color-mix(in srgb,var(--pay) 16%,transparent)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 38%,transparent)}to{background:transparent}}
.empty{color:var(--mut);padding:18px 16px}
#addbox{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}#addbox[hidden]{display:none}
#addbox input{flex:1;min-width:130px;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--field);color:var(--tx);padding:0 12px;font-size:16px}
.foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.dock{flex:none;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--bd);box-shadow:0 -10px 32px rgba(18,48,42,.12)}
.dockin{max-width:600px;margin:0 auto;padding:14px 16px 14px}
.status{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;font-weight:700;min-height:18px}
#lat{margin-left:auto;font-weight:600}
.wave{display:flex;gap:3px;align-items:center;height:16px}
.wave i{width:3px;height:5px;border-radius:2px;background:var(--mut);transition:background .2s}
.wave.on i{background:var(--gold);animation:bar .9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.15s}.wave.on i:nth-child(3){animation-delay:.3s}.wave.on i:nth-child(4){animation-delay:.45s}
@keyframes bar{50%{height:16px}}
.heard{color:var(--mut);font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heard:empty{display:none}
.reply{font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.01em;margin:6px 0 2px;max-height:30vh;overflow:auto}
.reply.in,.chip{animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
#chips,#choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}#chips:empty,#choices:empty{display:none}
.chip{padding:6px 12px;border-radius:999px;color:#fff;font-size:14px;font-weight:700}.chip.cr{background:var(--cr);color:#fff}.chip.pay{background:var(--pay);color:#fff}
.pick{min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--tx);font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s}
.pick:active{transform:scale(.96)}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--bd);border-radius:999px;padding:0 6px 0 18px;min-height:56px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 26%,transparent)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font-size:16px;outline:0}
#go{width:44px;height:44px;border-radius:50%;border:0;background:var(--tx);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}#go:active{transform:scale(.92)}
#mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--gold);color:#12302A;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 8px 20px color-mix(in srgb,var(--gold) 45%,transparent);transition:transform .15s,background .25s}
#mic:active{transform:scale(.93)}
#mic.on{background:var(--cr);color:#fff;animation:ring 1.3s ease-out infinite}
@keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--cr) 50%,transparent)}to{box-shadow:0 0 0 24px transparent}}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 64px);max-width:568px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ov{position:fixed;inset:0;background:rgba(8,20,17,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:600px;max-height:86dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:31;box-shadow:0 -16px 48px rgba(0,0,0,.3)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:2px auto 16px}
.sh-h{display:flex;gap:14px;align-items:center}.av.lg{width:56px;height:56px;font-size:22px}
.sh-n{font-size:21px;font-weight:800;letter-spacing:-.01em}.sh-t{color:var(--mut);font-size:14px}
.sh-bal{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:14px 0;display:flex;align-items:baseline;gap:10px}.sh-bal small{font-size:15px;font-weight:600;color:var(--mut);letter-spacing:0}
.sh-a{display:flex;gap:10px;margin-top:16px}.sh-a .btn{flex:1;min-height:50px}
.btn.dng{color:var(--cr);border-color:color-mix(in srgb,var(--cr) 45%,var(--bd))}
.sh-title{font-size:21px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}.sh-p{color:var(--mut);margin:0 0 16px}
.opt{display:block;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--tx);font-size:16px;font-weight:700;text-align:left;cursor:pointer;margin-bottom:10px;transition:transform .15s}
.opt:active{transform:scale(.98)}.opt small{display:block;font-weight:500;color:var(--mut);font-size:13px;margin-top:2px}.opt.dng{color:var(--cr)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}.steps li{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}.steps b{display:block;margin-bottom:2px}.steps span{color:var(--mut);font-size:14px}
.top1{margin-top:12px;font-size:13px;opacity:.8}.top1:empty{display:none}
.nm{overflow:hidden}.brand{white-space:nowrap}
@media (max-width:430px){.slogan{display:none}}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;touch-action:manipulation;background:radial-gradient(90% 38% at 50% -6%,color-mix(in srgb,var(--gold) 17%,transparent),transparent 72%),var(--bg)}
.top>div:nth-child(2){min-width:0}.brand{overflow:hidden;text-overflow:ellipsis}
.logo{background:linear-gradient(145deg,var(--ink),color-mix(in srgb,var(--ink) 65%,var(--pay)));box-shadow:0 6px 16px color-mix(in srgb,var(--ink) 30%,transparent)}
.seg{--sw:68px;position:relative;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:3px}
.seg button{position:relative;z-index:1;flex:none;width:var(--sw);text-align:center;border:0;background:none;color:var(--mut);font-weight:800;font-size:12.5px;min-height:32px;padding:0;border-radius:999px;cursor:pointer;transition:color .3s}
.seg button.on{color:#12302A}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:var(--sw);background:var(--gold);border-radius:999px;box-shadow:0 3px 10px color-mix(in srgb,var(--gold) 50%,transparent);transition:transform .4s cubic-bezier(.3,1.25,.5,1)}
.seg[data-v=en] i{transform:translateX(var(--sw))}
.wrap{transition:opacity .18s ease,transform .18s ease}.wrap.fade{opacity:0;transform:translateY(8px)}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--ink) 25%,color-mix(in srgb,var(--ink) 70%,var(--pay)));animation:rise .55s cubic-bezier(.2,.8,.2,1)}
.hero::after{content:"";position:absolute;right:-70px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 34%,transparent),transparent 68%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.big{font-size:44px;background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--gold) 65%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.list,.row,.btn,.try button,.pick,.opt,.icon{transition:transform .22s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s,box-shadow .2s,opacity .2s}
button.row:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
button.row:active{transform:scale(.985)}
.try button:hover{transform:translateY(-2px);box-shadow:0 6px 14px color-mix(in srgb,var(--gold) 22%,transparent)}
.av{box-shadow:0 0 0 3px var(--card),0 0 0 4.5px color-mix(in srgb,currentColor 20%,transparent)}
.dock{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
#mic{width:72px;height:72px;background:linear-gradient(145deg,#FFCB45,var(--gold));animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 10px 30px color-mix(in srgb,var(--gold) 70%,transparent);transform:scale(1.04)}}
.heard{font-style:italic}
.chip,.pick{animation:pop .38s cubic-bezier(.3,1.4,.5,1) both}.chip{box-shadow:0 4px 10px rgba(0,0,0,.14)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}}
@media (max-width:400px){.brand{font-size:17px}.icon{width:36px;height:36px}.top{gap:8px;padding:12px}.ctl{gap:6px}.seg{--sw:62px}}

</style></head><body>

<div class="scroll"><div class="wrap">

/* ---------- Devanagari to Roman (so Hindi-script STT output still parses) ---------- */
const DC={'क':'k','ख':'kh','ग':'g','घ':'gh','च':'ch','छ':'chh','ज':'j','झ':'jh','ट':'t','ठ':'th','ड':'d','ढ':'dh','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ण':'n','ळ':'l'};
const DV={'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ा':'aa','ि':'i','ी':'ee','ु':'u','ू':'oo','े':'e','ै':'ai','ो':'o','ौ':'au','ं':'n','ँ':'n','ः':'h'};
function tr(s){if(!/[\u0900-\u097F]/.test(s))return s;
  s=s.replace(/[०-९]/g,d=>d.charCodeAt(0)-2406);let o='';
  for(let i=0;i<s.length;i++){const c=s[i];
    if(DC[c]){o+=DC[c];const n=s[i+1];if(n&&(DV[n]||n==='्'||n==='़'))continue;if(n&&DC[n])o+='a'}
    else if(DV[c])o+=DV[c];else if(c!=='्'&&c!=='़')o+=c}
  return o}

'one 1,two 2,three 3,four 4,five 5,six 6,seven 7,eight 8,nine 9,ten 10,eleven 11,twelve 12,thirteen 13,fourteen 14,fifteen 15,sixteen 16,seventeen 17,eighteen 18,nineteen 19'.split(',').forEach(p=>{const[a,b]=p.split(' ');UE[nz(a)]=+b});

const BIGW={sau:100,hundred:100,hazar:1000,hajar:1000,thousand:1000,lakh:1e5,lakhs:1e5,lac:1e5};

const CR=N(['udhar','udhare','udhari','credit','likh','likho','loan','loaned','lon','lone','took','taken','borrow','borrowed','lent','lend','owe','owes','owed','debit']);
const PAY=N(['diya','diye','di','jama','paid','pay','pays','mila','mile','wapas','chukaya','chuka','cash','received','receive','aya','laut','returned','return','repaid','repay','refund','refunded','settled','cleared','deposit','deposited']);

const GIVE=N(['gave','give','given','gives']);
const PRON=N(['he','she','him','her','they','them','usne','uska','uski','woh','wo','vo']);
const PART=N(['ka','ki','ke','ne','ko','se']);
const WD={ravivar:0,itvar:0,somvar:1,mangalvar:2,budhvar:3,guruvar:4,virvar:4,shukravar:5,shanivar:6,sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
const UNDO=N(['undo','hatao','hata','cancel','delete','mita','mitao','remove','erase']);

const HON=N(['bhai','bhaiya','bhae','ji','je','sahab','sahib','saab','uncle','aunty','didi','madam','sir','bhabhi','chacha','mama','kaka','dada','dadi','mami','mausi','bua']);
const STOP=N([...HON,'wala','wale','wali',...PART,...CR,...PAY,...GIVE,...PRON,...BIG,...Object.keys(WD),'tha','thi','the','hai','ho','aj','kal','parso','parson','din','pehle','pichle','pichla','nahi','sorry','galat','matlab','rupaye','rupay','rupiye','rupee','rupees','rs','to','toh','bhi','mera','meri','mere','abhi','pehla','dusra','naya',
'today','yesterday','tomorrow','ago','last','day','days','before','for','from','with','that','this','his','hers','you','your','our','back','again','just','please','add','new','entry','record','note','write','put','got','get','amount','money','only','how','much','what','whats','does','did','was','were','are','been','have','has','had','will','would','can','could','show','tell','check','all','any','some','one','not','but','actually','wait','meant','change','make','remove','undo','cancel','delete','ok','okay','yes','yeah','hey','hello','person','customer','khata','account','of','in','on','at','by','is','it','its','my','me','mine','than','now','here','there','want','wants','need','needs','let','lets','and','then','also','half','each','pending','balance','total']);
const key=s=>{s=nz(s).replace(/h/g,'');return s[0]+s.slice(1).replace(/[aeiouy]/g,'')};
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;

/* ---------- tokenise, numbers, dates ---------- */

const AL={lawn:'loan',lone:'loan',loin:'loan',lown:'loan',lowan:'loan',paint:'paid',pade:'paid',paed:'paid',ped:'paid',tuk:'tok',handred:'hundred',hundrad:'hundred',hundreds:'hundred',thosand:'thousand',thousands:'thousand',udar:'udhar',uthar:'udhar',odhar:'udhar',zama:'jama',vapas:'wapas',wapis:'wapas',rupya:'rupaye',rupia:'rupaye'};
function toks(raw){
  const s=tr(raw).toLowerCase().replace(/₹|\brs\.?(?=\s|\d)/g,' ').replace(/(\d),(?=\d{3})/g,'$1')
    .replace(/\b(hundred|thousand|lakh|lakhs|lac|sau|hazar)\s+and\b/g,'$1')
    .replace(/[,;]|\baur\b|\bphir\b|\bfir\b|\band\b|\bthen\b|\balso\b/g,' | ').replace(/[^a-z0-9|\s]/g,' ');

const isDur=w=>w==='din'||w==='days'||w==='day'||w==='dino';
function numAt(t,i){
  const w0=t[i],en=LG==='en';

  if(/^\d+$/.test(w0)){const v=+w0,b=BIGW[t[i+1]],nx=t[i+1]||'';
    if(b&&v<1000)return{v:v*b,n:2};

  let tot=0,cur=0,half=0,k=i,any=false,last='',hun=false;

    if(BIGW[x]){const b=BIGW[x];if(b===100){if(hun)break;cur=(cur||1)*100;hun=true}else{tot+=(cur||1)*b;cur=0;hun=false}last='b'}
    else if(x==='dhai'){cur=2.5;last='u'}else if(x==='dedh'){cur=1.5;last='u'}else if(x==='sava'||x==='sawa'){cur=1.25;last='u'}
    else if(x==='sadhe')half=1;
    else if(UE[x]!==undefined){if(last==='u'||last==='e'||(last==='t'&&UE[x]>9))break;cur+=UE[x];last=UE[x]>9?'e':'u'}
    else if(TE[x]!==undefined){if(last==='u'&&!hun&&cur>0&&cur<10)cur=cur*100+TE[x];else if(last==='t'||last==='e')break;else cur+=TE[x];last='t'}
    else if(!en&&U[x]!==undefined){cur+=U[x]+half*0.5;half=0;last='u'}
    else break;any=true}

function dateOf(t){
  for(let i=0;i<t.length;i++){const w=t[i];
    if((w==='before'&&t[i+1]==='yesterday')||w==='parso'||w==='parson')return -2;
    if(w==='aj'||w==='today')return 0;if(w==='kal'||w==='yesterday')return -1;
    if(WD[w]!==undefined){const diff=(new Date().getDay()-WD[w]+7)%7||7;return -diff}
    const m=numAt(t,i);if(m&&isDur(t[i+m.n]))return -m.v}
  return 0}

/* ---------- split one sentence into entries ---------- */
function segs(t){
  const out=[];let c=[],hasA=false,hasT=false;
  const push=()=>{if(c.length)out.push(c);c=[];hasA=false;hasT=false};
  for(let i=0;i<t.length;i++){const w=t[i];
    if(w==='|'){push();continue}
    if(TW(w)&&hasA&&hasT){let k=c.length;while(k>0&&/^[a-z]{3,}$/.test(c[k-1])&&!STOP.has(c[k-1])&&!isQ(c[k-1]))k--;
      const tail=c.splice(k);push();c=tail}
    c.push(w);
    const m=numAt(t,i);if(m&&!isDur(t[i+m.n]))hasA=true;
    if(TW(w)){if(hasA)push();else hasT=true}}
  push();return out}
function parseSeg(c){
  let amt=null,type=null;
  for(let i=0;i<c.length;i++){const w=c[i];
    if(amt===null){const m=numAt(c,i);if(m&&!isDur(c[i+m.n])){amt=m.v;i+=m.n-1;continue}}
    if(CR.has(w))type='cr';else if(PAY.has(w))type='pay';
    else if(GIVE.has(w)){const p=c[i-1],n=c[i+1];
      type=(n==='me'||n==='back'||(p&&p!=='i'&&(PRON.has(p)||(/^[a-z]{3,}$/.test(p)&&!STOP.has(p)))))?'pay':'cr'}}
  return{amt,type,off:dateOf(c),c}}

/* ---------- customer matching ---------- */
const pn=s=>{s=nz(s.toLowerCase()).replace(/([kgcjtdbps])h/g,(m,a)=>a==='p'?'f':a).replace(/w/g,'v').replace(/z/g,'j').replace(/[qc]/g,'k').replace(/x/g,'ks').replace(/h/g,'').replace(/[eoy]/g,m=>m==='o'?'u':'i');return nz(s)};
const sk=s=>s[0]+s.slice(1).replace(/[aiu]/g,'');
function score(w,n){const a=pn(w),b=pn(n);if(!a||!b)return 0;if(a===b)return 1;
  if(sk(a)===sk(b))return lev(a,b)<=1?.95:.8;
  if(Math.min(a.length,b.length)>=4&&(lev(a,b)<=1||a.startsWith(b)||b.startsWith(a)))return .7;return 0}
function findCust(c){
  const ok=w=>/^[a-z]{3,}$/.test(w)&&!STOP.has(w)&&!NUMW(w)&&!isQ(w);
  const cand=c.filter(ok);
  for(let i=0;i<c.length-1;i++){const a=c[i],b=c[i+1];if(ok(a)&&ok(b))cand.push(a+b)}
  let top=0,hits=[];
  for(const w of cand)for(const x of S.cust){
    let s=0;for(const n of [...x.name.split(' '),...(x.alias||[])])s=Math.max(s,score(w,n));
    if(s>=.6){if(s>top){top=s;hits=[{x,w}]}else if(s===top)hits.push({x,w})}}
  const tagged=S.cust.filter(x=>x.tag&&x.tag.split(/\s+/).map(nz).filter(t=>t.length>2&&!STOP.has(t)).some(t=>cand.some(w=>pn(w)===pn(t))));
  let cands=[...new Map(hits.map(h=>[h.x.id,h.x])).values()];
  if(cands.length>1&&tagged.length){const f=cands.filter(x=>tagged.includes(x));if(f.length)cands=f}
  if(!cands.length&&tagged.length)return{cands:tagged,exact:true,w:null};
  if(!cands.length)return null;
  return{cands,exact:top>=.9||(cands.length===1&&tagged.includes(cands[0])),w:hits[0].w}}
const cap=n=>n.map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
function newName(c){
  const okw=w=>/^[a-z]{2,}$/.test(w)&&!STOP.has(w)&&!NUMW(w)&&!isQ(w)&&!HON.has(w);
  let i=c.findIndex(w=>PART.has(w));
  if(i<0)i=c.findIndex(w=>/^\d/.test(w)||NUMW(w));
  if(i>=1){const n=[];
    for(let j=i-1;j>=0&&n.length<2;j--){const w=c[j];if(HON.has(w))continue;if(okw(w))n.unshift(w);else break}
    if(n.length)return cap(n)}
  const n=[];for(const w of c){if(okw(w))n.push(w);else if(n.length)break;if(n.length===2)break}
  return n.length?cap(n):null}

/* ---------- output ---------- */
let flash=[],soundOn=true,uref=null,spokeT=0,voices=[];
const wave=on=>$('wave').classList.toggle('on',on);
const loadV=()=>{try{voices=speechSynthesis.getVoices()||[]}catch(e){}};loadV();
try{speechSynthesis.addEventListener('voiceschanged',loadV)}catch(e){}
const pickVoice=()=>{if(!voices.length)loadV();
  for(const re of LG==='en'?[/en[-_]IN/i,/en[-_]GB/i,/en[-_]US/i,/^en/i]:[/en[-_]IN/i,/^hi/i,/^en/i]){const v=voices.find(x=>re.test(x.lang));if(v)return v}return null};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),6000)}
function speak(text){
  if(!soundOn)return;
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast(_t('nosr'));return}
  try{const ss=speechSynthesis;ss.cancel();if(ss.resume)ss.resume();
    setTimeout(()=>{try{
      const u=new SpeechSynthesisUtterance(text);uref=u;const vo=pickVoice();
      if(vo){u.voice=vo;u.lang=vo.lang}else u.lang='en-IN';
      u.rate=LG==='en'?1:.95;let ok=false;
      u.onstart=()=>{ok=true;wave(true);$('hint').textContent=_t('spk')};
      u.onend=()=>{wave(false);$('hint').textContent=_t('idle')};
      u.onerror=e=>{wave(false);$('hint').textContent=_t('idle');if(e&&e.error&&e.error!=='canceled'&&e.error!=='interrupted')toast(_t('serr',e.error))};
      ss.speak(u);
      clearTimeout(spokeT);spokeT=setTimeout(()=>{if(!ok)toast(_t('mute'))},2000);
    }catch(e){}},80)}catch(e){}}
function say(text,chips,silent){
  const r=$('reply');r.textContent=text;r.classList.remove('in');void r.offsetWidth;r.classList.add('in');
  $('chips').innerHTML=(chips||[]).map(c=>'<span class="chip '+c.k+'">'+esc(c.t)+'</span>').join('');
  $('lat').textContent=T0?_t('lat',Math.max(1,Math.round(performance.now()-T0))):'';
  if(!silent)speak(text)}
const AV=[['#F2A900','#12302A'],['#2E7D4F','#fff'],['#C8472B','#fff'],['#3F6C8F','#fff'],['#7A5C9E','#fff']];
const UP='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const DN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M16 17H7V8"/></svg>';
function render(){
  const cs=[...S.cust].sort((a,b)=>bal(b.id)-bal(a.id)),td=dstr(new Date());
  let ud=0,wa=0;S.ent.forEach(e=>{if(e.date===td){if(e.type==='cr')ud+=e.amt;else wa+=e.amt}});
  tween($('tot'),cs.reduce((a,c)=>a+Math.max(0,bal(c.id)),0));tween($('ud'),ud);tween($('wa'),wa);
  const tp=cs[0]&&bal(cs[0].id)>0?cs[0]:null;$('top1').textContent=tp?_t('top',label(tp),money(bal(tp.id))):'';
  $('cc').textContent=cs.length;
  $('cl').innerHTML=cs.length?cs.map(c=>{const b=bal(c.id),a=AV[c.id%5];
    return '<button class="row cust'+(flash.includes(c.id)?' flash':'')+'" data-id="'+c.id+'"><span class="av" style="background:'+a[0]+';color:'+a[1]+'">'+esc(c.name[0].toUpperCase())+'</span><span class="nm">'+esc(c.name)+(c.tag?'<em>'+esc(tagOf(c.tag))+'</em>':'')+'<small>'+_t('look')+'</small></span><span class="amt"><b class="'+(b>0?'cr':b<0?'pay':'')+'">'+money(Math.abs(b))+'</b><small>'+(b>0?_t('due'):b<0?_t('adv'):_t('clr'))+'</small></span></button>'}).join(''):'<div class="empty">'+_t('empty')+'</div>';
  flash=[];
  const h=S.ent.slice(-8).reverse();
  $('hl').innerHTML=h.length?h.map(e=>'<div class="row"><span class="ic '+e.type+'">'+(e.type==='cr'?UP:DN)+'</span><span class="nm">'+esc(label(custById(e.cid)))+'<small>'+fmtDate(e.date)+'</small></span><span class="amt"><b class="'+e.type+'">'+money(e.amt)+'</b><small>'+_t(e.type)+'</small></span></div>').join(''):'<div class="empty">'+_t('noent')+'</div>'}

/* ---------- disambiguation ---------- */
function ask(cands,nw,resume,heard){
  const ch=cands.map((c,i)=>({c,l:c.tag?tagOf(c.tag):('#'+(i+1))}));
  if(nw)ch.push({nw:nw[0].toUpperCase()+nw.slice(1)});
  pending={ch,resume,heard};
  $('choices').innerHTML=ch.map((x,j)=>'<button class="pick" data-j="'+j+'">'+(j+1)+'. '+esc(x.nw?_t('nw',x.nw):x.l)+'</button>').join('');
  const q=cands.length>1&&!nw?_t('askq',cands[0].name):_t('askn');
  say(q+' '+ch.map((x,j)=>(j+1)+' '+(x.nw?_t('nwl',x.nw):x.l)).join(', ')+'.')}
function pick(j){const p=pending;if(!p)return;const x=p.ch[j];pending=null;if(p.heard&&x.c&&!x.nw&&x.c.name&&score(p.heard,x.c.name)<.9){(x.c.alias=x.c.alias||[]).push(p.heard);save()}$('choices').innerHTML='';
  T0=performance.now();p.resume(x.nw?addCust(x.nw,''):x.c)}
const ORD={ek:0,one:0,first:0,pehla:0,do:1,two:1,second:1,dusra:1,teen:2,three:2,third:2,tisra:2};
function pend(t){
  const ch=pending.ch;
  for(let j=0;j<ch.length;j++){
    const x=ch[j];
    if(t.includes(String(j+1))||t.some(w=>ORD[w]===j)||(x.c&&x.c.tag&&t.some(w=>w.length>2&&nz(x.c.tag).includes(w)))||(x.nw&&(t.includes('naya')||t.includes('new')))){pick(j);return true}}
  return false}

/* ---------- actions ---------- */
function runEntries(ctx,i,last,forced){
  const sl=ctx.sl;
  for(;i<sl.length;i++){const s=sl[i];if(s.amt===null)continue;
    let c=forced||null;forced=null;
    if(!c){const f=findCust(s.c);
      if(f){if(f.exact&&f.cands.length===1)c=f.cands[0];
        else return ask(f.cands,f.exact?null:f.w,x=>runEntries(ctx,i,last,x),f.w)}
      else{const nn=newName(s.c);if(nn){c=addCust(nn,'');ctx.notes.push(_t('newc',nn))}else c=last}}
    if(!c)return say(_t('who'));
    if(!s.type)return say(_t('typeq',spoken(c),s.amt));
    const e=add(c.id,s.amt,s.type,s.off);last=c;ctx.done.push({c,e,off:s.off})}
  S.batch=ctx.done.map(d=>d.e.id);flash=ctx.done.map(d=>d.c.id);save();render();
  const tots=[...new Set(ctx.done.map(d=>d.c.id))].map(id=>_t('tot',spoken(custById(id)),bal(id))).join('. ');
  say(_t('done',ctx.notes.join(' '),ctx.done.map(d=>_t('entry',spoken(d.c),d.e.amt,d.e.type,d.off)).join(', '),tots),ctx.done.map(d=>({k:d.e.type,t:label(d.c)+'  '+money(d.e.amt)+'  '+_t(d.e.type)+'  '+dword(d.off)})))}
function answer(c){
  flash=[c.id];render();const b=bal(c.id);
  say(_t('ans',spoken(c),b),S.ent.filter(e=>e.cid===c.id).slice(-3).map(e=>({k:e.type,t:_t(e.type)+' '+money(e.amt)+'  '+fmtDate(e.date)})))}
function query(t){
  const f=findCust(t);if(!f)return say(_t('whoq'));
  if(f.exact&&f.cands.length===1)return answer(f.cands[0]);
  ask(f.cands,f.exact?null:f.w,answer,f.w)}
function correct(sl,t){
  const a=sl.find(s=>s.amt!==null),ty=t.some(w=>CR.has(w))?'cr':t.some(w=>PAY.has(w))?'pay':null;
  let es=(S.batch||[]).map(id=>S.ent.find(x=>x.id===id)).filter(Boolean);
  if(!es.length){const e=S.ent.find(x=>x.id===S.last);if(e)es=[e]}
  if(!es.length)return say(_t('nofix'));
  if(a&&ty){const m=es.filter(e=>e.type===ty);if(m.length===1)es=m}
  const fix=e=>{
    if(a)e.amt=a.amt;else if(ty)e.type=ty;
    flash=[e.cid];save();render();const c=custById(e.cid),b=bal(c.id);
    say(_t('fixed',spoken(c),e.amt,e.type,b),[{k:e.type,t:label(c)+'  '+money(e.amt)+'  '+_t(e.type)}])};
  if(es.length===1)return fix(es[0]);
  const ch=es.map(e=>({c:e,l:_t(e.type)+' '+money(e.amt)}));
  pending={ch,resume:fix};
  $('choices').innerHTML=ch.map((x,j)=>'<button class="pick" data-j="'+j+'">'+(j+1)+'. '+esc(x.l)+'</button>').join('');
  say(_t('pickfix')+' '+ch.map((x,j)=>(j+1)+' '+x.l).join(', ')+'.')}
function undo(){
  const i=S.ent.findIndex(x=>x.id===S.last);if(i<0)return say(_t('nothing'));
  const e=S.ent.splice(i,1)[0];S.last=S.ent.length?S.ent[S.ent.length-1].id:0;save();render();
  say(_t('removed',spoken(custById(e.cid)),e.amt))}

function run(raw){
  T0=performance.now();$('heard').textContent=raw;
  const t=toks(raw);
  if(pending&&pend(t))return;
  pending=null;$('choices').innerHTML='';
  const sl=segs(t).map(parseSeg),hasAmt=sl.some(s=>s.amt!==null);
  if(!hasAmt&&t.some(w=>UNDO.has(w)))return undo();
  const corr=t.slice(0,3).some(w=>CORR.has(w)||w.startsWith('nah'));
  if(corr&&(hasAmt||t.some(TW)))return correct(sl,t);
  if(!hasAmt&&t.some(isQ))return query(t);
  if(hasAmt){const le=S.ent.find(e=>e.id===S.last);
    return runEntries({sl,notes:[],done:[]},0,t.some(w=>PRON.has(w))&&le?custById(le.cid):null,null)}
  say(_t('unk'))}

/* ---------- mic ---------- */
let rec=null,final='',st=0,retried=false,retry=false;const ANDROID=/Android/i.test((navigator&&navigator.userAgent)||'');
const altScore=a=>{try{const k=toks(a),sl=segs(k).map(parseSeg);return(sl.some(s=>s.amt!==null)?2:0)+(sl.some(s=>s.type)?1:0)+(findCust(k)?1:0)}catch(e){return 0}};
const dd=s=>{const w=s.trim().split(/\s+/),h=w.length/2;return w.length>=2&&w.length%2===0&&w.slice(0,h).join(' ').toLowerCase()===w.slice(h).join(' ').toLowerCase()?w.slice(0,h).join(' '):s.trim()};
const pickAlt=rs=>rs.map(al=>al.reduce((b,a)=>altScore(a)>altScore(b)?a:b,al[0])).join(' ');
function mic(auto){
  if(rec){clearTimeout(st);rec.stop();return}
  if(auto!==true)retried=false;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){T0=0;say(_t('nomic'),[],true);return}
  try{speechSynthesis.cancel()}catch(e){}
  rec=new SR();rec.lang=LG==='en'?'en-IN':'hi-IN';rec.interimResults=true;rec.continuous=!ANDROID;rec.maxAlternatives=3;final='';clearTimeout(st);
  rec.onstart=()=>{$('mic').classList.add('on');$('hint').textContent=_t('prep');$('heard').textContent=''};
  rec.onaudiostart=()=>{$('hint').textContent=_t('lis');wave(true);try{navigator.vibrate(18)}catch(x){}};
  rec.onresult=e=>{let s='';const best=[];for(const r of e.results){s+=r[0].transcript;best.push(Array.from(r).map(a=>a.transcript))}
    $('heard').textContent=s;final=dd(pickAlt(best));clearTimeout(st);if(rec&&!ANDROID)st=setTimeout(()=>{try{rec&&rec.stop()}catch(x){}},1600)};
  rec.onerror=e=>{final='';clearTimeout(st);if(e.error==='aborted')return;if(e.error==='no-speech'&&!retried){retried=true;retry=true;return}T0=0;say(e.error==='not-allowed'||e.error==='service-not-allowed'?_t('perm'):_t('merr',e.error),[],true)};
  rec.onend=()=>{rec=null;$('mic').classList.remove('on');wave(false);$('hint').textContent=_t('idle');clearTimeout(st);if(retry){retry=false;setTimeout(()=>mic(true),250);return}if(final)run(final)};
  try{rec.start()}catch(e){rec=null}}

/* ---------- wire up ---------- */
$('mic').onclick=mic;
const send=()=>{const v=$('ti').value.trim();if(v){$('ti').value='';run(v)}};
$('go').onclick=send;$('ti').onkeydown=e=>{if(e.key==='Enter')send()};
$('choices').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.j)};
$('undo').onclick=()=>{T0=performance.now();undo()};
$('cl').onclick=e=>{const b=e.target.closest('.cust');if(b)custSheet(+b.dataset.id)};
$('addtog').onclick=()=>{const a=$('addbox');a.hidden=!a.hidden;if(!a.hidden)$('nn').focus()};
$('na').onclick=()=>{const n=$('nn').value.trim();if(!n)return;const c=addCust(n[0].toUpperCase()+n.slice(1),$('nt').value.trim());flash=[c.id];$('nn').value='';$('nt').value='';$('addbox').hidden=true;save();render();T0=0;say(_t('added',n),[],true)}
function tween(el,to){const from=+el.dataset.v||0;el.dataset.v=to;
  if(typeof requestAnimationFrame!=='function'||from===to){el.textContent=money(to);return}
  const t0=performance.now(),st=t=>{const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);el.textContent=money(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
function openSheet(h){$('sbody').innerHTML=h;$('ov').classList.add('open');$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false')}
function closeSheet(){$('ov').classList.remove('open');$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true')}
let cfn=null;
function confirmSheet(t,p,ok,fn){cfn=fn;openSheet('<h3 class="sh-title">'+esc(t)+'</h3><p class="sh-p">'+esc(p)+'</p><div class="sh-a"><button class="btn" data-a="no">'+_t('cancel')+'</button><button class="btn dng" data-a="ok">'+esc(ok)+'</button></div>')}
function custSheet(id){
  const c=S.cust.find(x=>x.id===id);if(!c)return;const b=bal(id),a=AV[id%5],es=S.ent.filter(e=>e.cid===id).reverse();
  openSheet('<div class="sh-h"><span class="av lg" style="background:'+a[0]+';color:'+a[1]+'">'+esc(c.name[0].toUpperCase())+'</span><div><div class="sh-n">'+esc(c.name)+'</div><div class="sh-t">'+esc(c.tag?tagOf(c.tag):_t('notag'))+'</div></div></div>'
   +'<div class="sh-bal '+(b>0?'cr':b<0?'pay':'')+'">'+money(Math.abs(b))+'<small>'+(b>0?_t('due'):b<0?_t('adv'):_t('clr2'))+'</small></div>'
   +'<div class="list">'+(es.length?es.map(e=>'<div class="row"><span class="ic '+e.type+'">'+(e.type==='cr'?UP:DN)+'</span><span class="nm">'+cap1(_t(e.type))+'<small>'+fmtDate(e.date)+'</small></span><span class="amt"><b class="'+e.type+'">'+money(e.amt)+'</b></span></div>').join(''):'<div class="empty">'+_t('noent')+'</div>')+'</div>'
   +'<div class="sh-a"><button class="btn pri" data-a="say" data-id="'+id+'">'+_t('balbtn')+'</button><button class="btn dng" data-a="del" data-id="'+id+'">'+_t('delbtn')+'</button></div>')}
function cfgSheet(){openSheet('<h3 class="sh-title">'+_t('cfgT')+'</h3><p class="sh-p">'+_t('cfgP',S.cust.length,S.ent.length)+'</p>'
  +[['how','how','howD'],['test','test','testD'],['demo','demo','demoD'],['clear','clear','clearD',1]].map(o=>'<button class="opt'+(o[3]?' dng':'')+'" data-a="'+o[0]+'">'+_t(o[1])+'<small>'+_t(o[2])+'</small></button>').join(''))}
function howSheet(){openSheet('<h3 class="sh-title">'+_t('how')+'</h3><p class="sh-p">'+_t('howP')+'</p><ul class="steps">'+_t('steps').map(s=>'<li><b>'+s[0]+'</b><span>'+s[1]+'</span></li>').join('')+'</ul>')}
function delCust(id){const c=custById(id);S.cust=S.cust.filter(x=>x.id!==id);S.ent=S.ent.filter(e=>e.cid!==id);S.batch=(S.batch||[]).filter(i=>S.ent.some(e=>e.id===i));
  if(!S.ent.some(e=>e.id===S.last))S.last=S.ent.length?S.ent[S.ent.length-1].id:0;save();render();T0=0;say(_t('delSay',c.name),[],true)}
function clearAll(){pending=null;$('choices').innerHTML='';$('heard').textContent='';S={cust:[],ent:[],n:1,last:0,batch:[]};save();render();T0=0;say(_t('clrSay'),[],true)}
$('cfg').onclick=cfgSheet;$('ov').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('sbody').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
  if(a==='say'){closeSheet();T0=performance.now();answer(custById(id))}
  else if(a==='del'){const c=custById(id);confirmSheet(_t('delT',c.name),_t('delP'),_t('delOk'),()=>delCust(id))}
  else if(a==='clear')confirmSheet(_t('clrT'),_t('clrP'),_t('clrOk'),clearAll)
  else if(a==='demo')confirmSheet(_t('demoT'),_t('demoP'),_t('demoOk'),()=>{seed();render();T0=0;say(_t('demoSay'),[],true)})
  else if(a==='test'){closeSheet();T0=0;say(_t('testSay'))}
  else if(a==='how')howSheet()
  else if(a==='ok'){closeSheet();const f=cfn;cfn=null;if(f)f()}
  else if(a==='no')closeSheet()};

$('snd').onclick=()=>{soundOn=!soundOn;$('snd').setAttribute('aria-pressed',String(soundOn));$('snd').classList.toggle('off',!soundOn);if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}toast(soundOn?_t('son'):_t('soff'))};
document.addEventListener('pointerdown',()=>{try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}},{once:true});

/* ---------- apply language to the whole screen ---------- */
function applyLang(first){
  document.documentElement.lang=LG;
  [['slogan','slogan'],['hlt','hl'],['l1','l1'],['l2','l2'],['h-try','try'],['addtog','add'],['na','na'],['h-rec','rec'],['undo','undo'],['foot','foot']].forEach(([i,k])=>{$(i).textContent=_t(k)});
  $('nn').placeholder=_t('nn');$('nt').placeholder=_t('nt');$('ti').placeholder=_t('ti');
  $('hint').textContent=_t('idle');$('mic').setAttribute('aria-label',_t('idle'));
  const sg=$('lang');sg.dataset.v=LG;sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===LG));
  const ex=$('ex');ex.innerHTML='';
  _t('ex').forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>run(x);ex.appendChild(b)});
  const vt=document.createElement('button');vt.textContent=_t('vchk');vt.onclick=()=>{T0=0;say(_t('testSay'))};ex.appendChild(vt);
  if(first)$('reply').textContent=_t('intro')}
$('lang').onclick=e=>{const b=e.target.closest('button[data-l]');if(!b||b.dataset.l===LG)return;
  LG=b.dataset.l;try{localStorage.setItem(LK,LG)}catch(x){}
  try{speechSynthesis.cancel()}catch(x){}if(rec){try{rec.abort()}catch(x){}}
  pending=null;$('choices').innerHTML='';$('heard').textContent='';T0=0;
  const w=document.querySelector('.wrap');w.classList.add('fade');
  setTimeout(()=>{applyLang();render();say(_t('langOn'));w.classList.remove('fade')},170)};
applyLang(true);load();render();
})();
</script>
