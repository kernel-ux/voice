<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F5;--card:#FFFFFF;--tx:#12302A;--mut:#5E706A;--bd:#E1E8E5;--gold:#F2A900;--ink:#12302A;--on-ink:#F4F6F5;--cr:#C8472B;--pay:#1F8A57;--field:#F4F6F5;--sh:0 1px 2px rgba(18,48,42,.06),0 10px 28px rgba(18,48,42,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1613;--card:#14231E;--tx:#E8F0ED;--mut:#98ADA6;--bd:#243832;--ink:#1C332C;--on-ink:#E8F0ED;--cr:#F07A5C;--pay:#4FBF86;--field:#0B1613;--sh:0 10px 28px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1613;--card:#14231E;--tx:#E8F0ED;--mut:#98ADA6;--bd:#243832;--ink:#1C332C;--on-ink:#E8F0ED;--cr:#F07A5C;--pay:#4FBF86;--field:#0B1613;--sh:0 10px 28px rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{flex:none;display:flex;align-items:center;gap:12px;width:100%;max-width:600px;margin:0 auto;padding:12px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.slogan{font-size:13px;color:var(--mut)}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
select{appearance:none;-webkit-appearance:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:14px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .15s,opacity .2s}
.icon:active{transform:scale(.92)}.icon.off{opacity:.45}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:600px;margin:0 auto;padding:4px 16px 28px}
.hero{background:var(--ink);color:var(--on-ink);border-radius:24px;padding:20px 20px 16px;box-shadow:var(--sh)}
.hl{font-size:14px;opacity:.72;font-weight:600}
.big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.two span{display:block;font-size:13px;opacity:.7}.two b{font-size:18px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px;gap:10px}
.sec h2{margin:0;font-size:16px;font-weight:800}.sec h2 small{color:var(--mut);font-weight:600;margin-left:6px}
.try{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.try::-webkit-scrollbar{display:none}
.try button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,border-color .2s}
.try button:active{transform:scale(.96)}.try button:hover{border-color:var(--gold)}
.btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.list{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--bd);color:inherit;font:inherit;text-align:left}
.row:last-child{border-bottom:0}
button.row{cursor:pointer;transition:background .15s}button.row:active{background:var(--field)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.nm{flex:1;min-width:0;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.nm em{font-style:normal;font-size:12px;font-weight:600;color:var(--mut);background:var(--field);border:1px solid var(--bd);border-radius:999px;padding:1px 9px}
.nm small{flex-basis:100%;color:var(--mut);font-size:13px;font-weight:500}
.amt{text-align:right;display:flex;flex-direction:column}.amt b{font-size:17px}.amt small{color:var(--mut);font-size:12px}
.cr{color:var(--cr)}.pay{color:var(--pay)}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic.cr{background:color-mix(in srgb,var(--cr) 14%,transparent)}.ic.pay{background:color-mix(in srgb,var(--pay) 16%,transparent)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 38%,transparent)}to{background:transparent}}
.empty{color:var(--mut);padding:18px 16px}
#addbox{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}#addbox[hidden]{display:none}
#addbox input{flex:1;min-width:130px;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--field);color:var(--tx);padding:0 12px;font-size:16px}
.foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.dock{flex:none;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--bd);box-shadow:0 -10px 32px rgba(18,48,42,.12)}
.dockin{max-width:600px;margin:0 auto;padding:14px 16px 14px}
.status{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;font-weight:700;min-height:18px}
#lat{margin-left:auto;font-weight:600}
.wave{display:flex;gap:3px;align-items:center;height:16px}
.wave i{width:3px;height:5px;border-radius:2px;background:var(--mut);transition:background .2s}
.wave.on i{background:var(--gold);animation:bar .9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.15s}.wave.on i:nth-child(3){animation-delay:.3s}.wave.on i:nth-child(4){animation-delay:.45s}
@keyframes bar{50%{height:16px}}
.heard{color:var(--mut);font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heard:empty{display:none}
.reply{font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.01em;margin:6px 0 2px;max-height:30vh;overflow:auto}
.reply.in,.chip{animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
#chips,#choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}#chips:empty,#choices:empty{display:none}
.chip{padding:6px 12px;border-radius:999px;color:#fff;font-size:14px;font-weight:700}.chip.cr{background:var(--cr);color:#fff}.chip.pay{background:var(--pay);color:#fff}
.pick{min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--tx);font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s}
.pick:active{transform:scale(.96)}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--bd);border-radius:999px;padding:0 6px 0 18px;min-height:56px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 26%,transparent)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font-size:16px;outline:0}
#go{width:44px;height:44px;border-radius:50%;border:0;background:var(--tx);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}#go:active{transform:scale(.92)}
#mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--gold);color:#12302A;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 8px 20px color-mix(in srgb,var(--gold) 45%,transparent);transition:transform .15s,background .25s}
#mic:active{transform:scale(.93)}
#mic.on{background:var(--cr);color:#fff;animation:ring 1.3s ease-out infinite}
@keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--cr) 50%,transparent)}to{box-shadow:0 0 0 24px transparent}}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 64px);max-width:568px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="top">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg></div>
  <div><div class="brand">Voice Khata</div><div class="slogan">Bolo, aur khata likh jaayega</div></div>
  <div class="ctl">
    <select id="lang" aria-label="Bolne ki bhasha"><option value="hi-IN">हिन्दी</option><option value="en-IN">English</option></select>
    <button class="icon" id="snd" aria-label="Awaaz chalu ya band" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg></button>
  </div>
</div>

<div class="scroll"><div class="wrap">
  <div class="hero">
    <div class="hl">Kul baaki</div>
    <div class="big" id="tot">₹0</div>
    <div class="two"><div><span>Aaj ka udhaar</span><b id="ud">₹0</b></div><div><span>Aaj ki wasooli</span><b id="wa">₹0</b></div></div>
  </div>

  <div class="sec"><h2>Aise bolo</h2></div>
  <div class="try" id="ex"></div>

  <div class="sec"><h2>Customers<small id="cc"></small></h2><button class="btn" id="addtog">Naya customer</button></div>
  <div class="list">
    <div id="addbox" hidden><input id="nn" placeholder="Naam" aria-label="Naam"><input id="nt" placeholder="Pehchaan, jaise Sharma" aria-label="Pehchaan"><button class="btn pri" id="na">Jodo</button></div>
    <div id="cl"></div>
  </div>

  <div class="sec"><h2>Pichla hisaab</h2><button class="btn" id="undo">Pichli entry hatao</button></div>
  <div class="list" id="hl"></div>

  <div class="foot"><span>Data sirf is phone mein save hota hai.</span><button class="btn" id="reset">Demo data wapas</button></div>
</div></div>

<div class="dock"><div class="dockin">
  <div class="status"><span class="wave" id="wave"><i></i><i></i><i></i><i></i></span><span id="hint">Mic dabao aur bolo</span><span id="lat"></span></div>
  <div class="heard" id="heard"></div>
  <div class="reply" id="reply" aria-live="polite">Ek entry bolo, jaise “Suresh ka 150 udhaar”.</div>
  <div id="chips"></div>
  <div id="choices"></div>
  <div class="bar">
    <div class="field"><input id="ti" placeholder="Ya yahan type karo" autocomplete="off" aria-label="Type karke bolo"><button id="go" aria-label="Bhejo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <button id="mic" aria-label="Dabao aur bolo"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg></button>
  </div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={cust:[],ent:[],n:1,last:0},pending=null,T0=0;
const KEY='voicekhata.v1';

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}if(!S.cust.length)seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dstr=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
function seed(){S={cust:[],ent:[],n:1,last:0};
  const a=addCust('Ramesh','Sharma'),b=addCust('Ramesh','Gali wala'),c=addCust('Suresh','');
  add(a.id,500,'cr',-5);add(a.id,100,'pay',-3);add(a.id,140,'cr',-1);add(b.id,250,'cr',-2);add(c.id,120,'cr',-4);save()}
function addCust(name,tag){const c={id:S.n++,name,tag:tag||''};S.cust.push(c);return c}
function add(cid,amt,type,off){const e={id:S.n++,cid,amt,type,date:dayOff(off||0)};S.ent.push(e);S.last=e.id;return e}
const custById=id=>S.cust.find(c=>c.id===id)||{name:'?',tag:''};
const bal=id=>S.ent.filter(e=>e.cid===id).reduce((a,e)=>a+(e.type==='cr'?e.amt:-e.amt),0);
const nz=s=>s.toLowerCase().replace(/(.)\1+/g,'$1');
const dup=c=>S.cust.filter(x=>nz(x.name)===nz(c.name)).length>1;
const label=c=>c.name+(c.tag?' ('+c.tag+')':'');
const spoken=c=>dup(c)&&c.tag?c.name+' '+c.tag:c.name;
const dword=o=>o===0?'aaj':o===-1?'kal':o===-2?'parso':(-o)+' din pehle';
const money=n=>'₹'+n.toLocaleString('en-IN');
function fmtDate(iso){const t=new Date(dstr(new Date())),d=new Date(iso),k=Math.round((t-d)/864e5);
  return k<=0?'aaj':k===1?'kal':k===2?'parso':d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}

/* ---------- Devanagari to Roman (so Hindi-script STT output still parses) ---------- */
const DC={'क':'k','ख':'kh','ग':'g','घ':'gh','च':'ch','छ':'chh','ज':'j','झ':'jh','ट':'t','ठ':'th','ड':'d','ढ':'dh','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ण':'n','ळ':'l'};
const DV={'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ा':'aa','ि':'i','ी':'ee','ु':'u','ू':'oo','े':'e','ै':'ai','ो':'o','ौ':'au','ं':'n','ँ':'n','ः':'h'};
function tr(s){if(!/[\u0900-\u097F]/.test(s))return s;
  s=s.replace(/[०-९]/g,d=>d.charCodeAt(0)-2406);let o='';
  for(let i=0;i<s.length;i++){const c=s[i];
    if(DC[c]){o+=DC[c];const n=s[i+1];if(n&&(DV[n]||n==='्'||n==='़'))continue;if(n&&DC[n])o+='a'}
    else if(DV[c])o+=DV[c];else if(c!=='्'&&c!=='़')o+=c}
  return o}

/* ---------- vocab (written in collapsed form: aa->a, ee->e) ---------- */
const U={};'ek 1,do 2,teen 3,char 4,panch 5,chhe 6,che 6,saat 7,sat 7,aath 8,ath 8,nau 9,das 10,gyarah 11,barah 12,terah 13,chaudah 14,pandrah 15,solah 16,satrah 17,atharah 18,unnis 19,bis 20,tis 30,chalis 40,pachas 50,saath 60,sath 60,sattar 70,assi 80,nabbe 90'.split(',').forEach(p=>{const[a,b]=p.split(' ');U[nz(a)]=+b});
const BIG=new Set(['sau','hazar','hajar','dhai','dedh','sadhe','sava','sawa']);
const CR=new Set(['udhar','udhare','udhari','credit','likh','likho']);
const PAY=new Set(['diya','diye','di','jama','paid','pay','mila','mile','wapas','chukaya','chuka','cash','received','aya','laut']);
const PART=new Set(['ka','ki','ke','ne','ko','se']);
const WD={ravivar:0,itvar:0,somvar:1,mangalvar:2,budhvar:3,guruvar:4,virvar:4,shukravar:5,shanivar:6};
const UNDO=new Set(['undo','hatao','hata','cancel','delete','mita','mitao']);
const isQ=w=>/^(total|totl|kul|kitn|baki|bake|bakaya|hisab|balance|bata)/.test(w);
const STOP=new Set([...PART,...CR,...PAY,...BIG,...Object.keys(WD),'tha','thi','the','hai','ho','aj','kal','parso','parson','din','pehle','pichle','pichla','nahi','sorry','galat','matlab','rupaye','rupay','rupiye','rupee','rupees','rs','to','toh','bhi','mera','meri','mere','abhi','pehla','dusra','naya']);
const key=s=>{s=nz(s).replace(/h/g,'');return s[0]+s.slice(1).replace(/[aeiouy]/g,'')};
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

/* ---------- tokenise, numbers, dates ---------- */
function toks(raw){
  const s=tr(raw).toLowerCase().replace(/₹|\brs\.?(?=\s|\d)/g,' ').replace(/(\d),(?=\d{3})/g,'$1')
    .replace(/[,;]|\baur\b|\bphir\b|\bfir\b|\band\b/g,' | ').replace(/[^a-z0-9|\s]/g,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>w==='|'||/^\d/.test(w)?w:nz(w))}
function numAt(t,i){
  if(/^\d+$/.test(t[i]))return{v:+t[i],n:1};
  let tot=0,cur=0,half=0,k=i,any=false;
  for(;k<t.length;k++){const x=t[k];
    if(x==='sau'){cur=(cur||1)*100}
    else if(x==='hazar'||x==='hajar'){tot+=(cur||1)*1000;cur=0}
    else if(x==='dhai')cur=2.5;else if(x==='dedh')cur=1.5;else if(x==='sava'||x==='sawa')cur=1.25;
    else if(x==='sadhe')half=1;
    else if(U[x]!==undefined){cur+=U[x]+half*0.5;half=0}
    else break;any=true}
  return any&&tot+cur>0?{v:tot+cur,n:k-i}:null}
function dateOf(t){
  for(let i=0;i<t.length;i++){const w=t[i];
    if(w==='aj')return 0;if(w==='kal')return -1;if(w==='parso'||w==='parson')return -2;
    if(WD[w]!==undefined){const diff=(new Date().getDay()-WD[w]+7)%7||7;return -diff}
    if(/^\d+$/.test(w)&&t[i+1]==='din')return -(+w)}
  return 0}

/* ---------- split one sentence into entries ---------- */
function segs(t){
  const out=[];let c=[],hasA=false;
  const push=()=>{if(c.length)out.push(c);c=[];hasA=false};
  for(let i=0;i<t.length;i++){const w=t[i];
    if(w==='|'){push();continue}
    c.push(w);
    const m=numAt(t,i);if(m&&t[i+m.n]!=='din')hasA=true;
    if(hasA&&(CR.has(w)||PAY.has(w)))push()}
  push();return out}
function parseSeg(c){
  let amt=null,type=null;
  for(let i=0;i<c.length;i++){const w=c[i];
    if(amt===null){const m=numAt(c,i);if(m&&c[i+m.n]!=='din'){amt=m.v;i+=m.n-1;continue}}
    if(CR.has(w))type='cr';else if(PAY.has(w))type='pay'}
  return{amt,type,off:dateOf(c),c}}

/* ---------- customer matching ---------- */
function findCust(c){
  let best=null;
  for(const w of c){
    if(!/^[a-z]{3,}$/.test(w)||STOP.has(w)||U[w]!==undefined||isQ(w))continue;
    const k=key(w),ex=S.cust.filter(x=>key(x.name.split(' ')[0])===k);
    if(ex.length)return{cands:ex,exact:true,w};
    const fz=S.cust.filter(x=>w.length>=5&&lev(nz(x.name.split(' ')[0]),w)<=1);
    if(fz.length&&!best)best={cands:fz,exact:false,w}}
  return best}
function newName(c){
  let i=c.findIndex(w=>PART.has(w));
  if(i<0)i=c.findIndex(w=>/^\d/.test(w)||U[w]!==undefined||BIG.has(w));
  if(i<1)return null;
  const n=[];
  for(let j=i-1;j>=0&&n.length<2;j--){const w=c[j];if(/^[a-z]{2,}$/.test(w)&&!STOP.has(w)&&U[w]===undefined&&!isQ(w))n.unshift(w);else break}
  return n.length?n.map(w=>w[0].toUpperCase()+w.slice(1)).join(' '):null}

/* ---------- output ---------- */
let flash=[],soundOn=true,uref=null,spokeT=0;
const IDLE='Mic dabao aur bolo';
const wave=on=>$('wave').classList.toggle('on',on);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),6000)}
function speak(t){
  if(!soundOn)return;
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('Is browser mein awaaz support nahi hai. Chrome use karo.');return}
  try{const ss=speechSynthesis;ss.cancel();if(ss.resume)ss.resume();
    setTimeout(()=>{try{
      const u=new SpeechSynthesisUtterance(t);uref=u;
      const v=ss.getVoices(),vo=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/^hi/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang));
      if(vo){u.voice=vo;u.lang=vo.lang}else u.lang='en-IN';
      u.rate=.95;let ok=false;
      u.onstart=()=>{ok=true;wave(true);$('hint').textContent='Bol raha hoon'};
      u.onend=()=>{wave(false);$('hint').textContent=IDLE};
      u.onerror=e=>{wave(false);$('hint').textContent=IDLE;if(e&&e.error&&e.error!=='canceled'&&e.error!=='interrupted')toast('Awaaz error: '+e.error)};
      ss.speak(u);
      clearTimeout(spokeT);spokeT=setTimeout(()=>{if(!ok)toast('Awaaz nahi nikli. Media volume badhao, ya Settings mein Text-to-speech voice install karo.')},2000);
    }catch(e){}},80)}catch(e){}}
function say(text,chips,silent){
  const r=$('reply');r.textContent=text;r.classList.remove('in');void r.offsetWidth;r.classList.add('in');
  $('chips').innerHTML=(chips||[]).map(c=>'<span class="chip '+c.k+'">'+esc(c.t)+'</span>').join('');
  $('lat').textContent=T0?'Jawab '+Math.max(1,Math.round(performance.now()-T0))+' ms':'';
  if(!silent)speak(text)}
const AV=[['#F2A900','#12302A'],['#2E7D4F','#fff'],['#C8472B','#fff'],['#3F6C8F','#fff'],['#7A5C9E','#fff']];
const UP='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const DN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M16 17H7V8"/></svg>';
function render(){
  const cs=[...S.cust].sort((a,b)=>bal(b.id)-bal(a.id)),td=dstr(new Date());
  let ud=0,wa=0;S.ent.forEach(e=>{if(e.date===td){if(e.type==='cr')ud+=e.amt;else wa+=e.amt}});
  $('tot').textContent=money(cs.reduce((a,c)=>a+Math.max(0,bal(c.id)),0));$('ud').textContent=money(ud);$('wa').textContent=money(wa);
  $('cc').textContent=cs.length;
  $('cl').innerHTML=cs.length?cs.map(c=>{const b=bal(c.id),a=AV[c.id%5];
    return '<button class="row cust'+(flash.includes(c.id)?' flash':'')+'" data-id="'+c.id+'"><span class="av" style="background:'+a[0]+';color:'+a[1]+'">'+esc(c.name[0].toUpperCase())+'</span><span class="nm">'+esc(c.name)+(c.tag?'<em>'+esc(c.tag)+'</em>':'')+'<small>Sunne ke liye dabao</small></span><span class="amt"><b class="'+(b>0?'cr':b<0?'pay':'')+'">'+money(Math.abs(b))+'</b><small>'+(b>0?'baaki':b<0?'advance':'saaf')+'</small></span></button>'}).join(''):'<div class="empty">Abhi koi customer nahi. Pehli entry bolo.</div>';
  flash=[];
  const h=S.ent.slice(-8).reverse();
  $('hl').innerHTML=h.length?h.map(e=>'<div class="row"><span class="ic '+e.type+'">'+(e.type==='cr'?UP:DN)+'</span><span class="nm">'+esc(label(custById(e.cid)))+'<small>'+fmtDate(e.date)+'</small></span><span class="amt"><b class="'+e.type+'">'+money(e.amt)+'</b><small>'+(e.type==='cr'?'udhaar':'jama')+'</small></span></div>').join(''):'<div class="empty">Abhi koi entry nahi.</div>'}

/* ---------- disambiguation ---------- */
function ask(cands,nw,resume){
  const ch=cands.map((c,i)=>({c,l:c.tag||('#'+(i+1))}));
  if(nw)ch.push({nw:nw[0].toUpperCase()+nw.slice(1)});
  pending={ch,resume};
  $('choices').innerHTML=ch.map((x,j)=>'<button class="pick" data-j="'+j+'">'+(j+1)+'. '+esc(x.nw?'Naya: '+x.nw:x.l)+'</button>').join('');
  const q=cands.length>1&&!nw?'Kaunsa '+cands[0].name+'?':'Kaun sa customer? Pakka karo.';
  say(q+' '+ch.map((x,j)=>(j+1)+' '+(x.nw?'naya '+x.nw:x.l)).join(', ')+'.')}
function pick(j){const p=pending;if(!p)return;const x=p.ch[j];pending=null;$('choices').innerHTML='';
  T0=performance.now();p.resume(x.nw?addCust(x.nw,''):x.c)}
const ORD={ek:0,pehla:0,do:1,dusra:1,teen:2,tisra:2};
function pend(t){
  const ch=pending.ch;
  for(let j=0;j<ch.length;j++){
    const x=ch[j];
    if(t.includes(String(j+1))||t.some(w=>ORD[w]===j)||(x.c&&x.c.tag&&t.some(w=>w.length>2&&nz(x.c.tag).includes(w)))||(x.nw&&t.includes('naya'))){pick(j);return true}}
  return false}

/* ---------- actions ---------- */
function runEntries(ctx,i,last,forced){
  const sl=ctx.sl;
  for(;i<sl.length;i++){const s=sl[i];if(s.amt===null)continue;
    let c=forced||null;forced=null;
    if(!c){const f=findCust(s.c);
      if(f){if(f.exact&&f.cands.length===1)c=f.cands[0];
        else return ask(f.cands,f.exact?null:f.w,x=>runEntries(ctx,i,last,x))}
      else{const nn=newName(s.c);if(nn){c=addCust(nn,'');ctx.notes.push('Naya customer '+nn+' joda.')}else c=last}}
    if(!c)return say('Kiska hisaab? Naam bolo.');
    if(!s.type)return say(spoken(c)+' ka '+s.amt+': udhaar ya jama? Dobara bolo.');
    const e=add(c.id,s.amt,s.type,s.off);last=c;ctx.done.push({c,e,off:s.off})}
  S.batch=ctx.done.map(d=>d.e.id);flash=ctx.done.map(d=>d.c.id);save();render();
  const tot=[...new Set(ctx.done.map(d=>d.c.id))].map(id=>{const c=custById(id),b=bal(id);return spoken(c)+' ka total '+Math.abs(b)+(b>=0?' baaki':' advance')});
  const txt=ctx.notes.join(' ')+' '+ctx.done.map(d=>spoken(d.c)+' ka '+d.e.amt+(d.e.type==='cr'?' udhaar':' jama')+(d.off?' ('+dword(d.off)+')':'')).join(', ')+' likh diya. '+tot.join('. ')+'.';
  say(txt.trim(),ctx.done.map(d=>({k:d.e.type,t:label(d.c)+'  '+money(d.e.amt)+'  '+(d.e.type==='cr'?'udhaar':'jama')+'  '+dword(d.off)})))}
function answer(c){
  flash=[c.id];render();const b=bal(c.id);
  const txt=b>0?spoken(c)+' ka '+b+' rupaye baaki hai.':b<0?spoken(c)+' ne '+(-b)+' rupaye zyada diye hain.':spoken(c)+' ka hisaab saaf hai.';
  say(txt,S.ent.filter(e=>e.cid===c.id).slice(-3).map(e=>({k:e.type,t:(e.type==='cr'?'udhaar ':'jama ')+money(e.amt)+'  '+fmtDate(e.date)})))}
function query(t){
  const f=findCust(t);if(!f)return say('Kiska total? Naam bolo.');
  if(f.exact&&f.cands.length===1)return answer(f.cands[0]);
  ask(f.cands,f.exact?null:f.w,answer)}
function correct(sl,t){
  const a=sl.find(s=>s.amt!==null),ty=t.some(w=>CR.has(w))?'cr':t.some(w=>PAY.has(w))?'pay':null;
  let es=(S.batch||[]).map(id=>S.ent.find(x=>x.id===id)).filter(Boolean);
  if(!es.length){const e=S.ent.find(x=>x.id===S.last);if(e)es=[e]}
  if(!es.length)return say('Sudharne ke liye pichli entry nahi mili.');
  if(a&&ty){const m=es.filter(e=>e.type===ty);if(m.length===1)es=m}
  const fix=e=>{
    if(a)e.amt=a.amt;else if(ty)e.type=ty;
    flash=[e.cid];save();render();const c=custById(e.cid),b=bal(c.id);
    say('Theek hai, '+spoken(c)+' ka '+e.amt+(e.type==='cr'?' udhaar':' jama')+' kar diya. Total '+Math.abs(b)+(b>=0?' baaki.':' advance.'),[{k:e.type,t:label(c)+'  '+money(e.amt)+'  '+(e.type==='cr'?'udhaar':'jama')}])};
  if(es.length===1)return fix(es[0]);
  const ch=es.map(e=>({c:e,l:(e.type==='cr'?'udhaar ':'jama ')+money(e.amt)}));
  pending={ch,resume:fix};
  $('choices').innerHTML=ch.map((x,j)=>'<button class="pick" data-j="'+j+'">'+(j+1)+'. '+esc(x.l)+'</button>').join('');
  say('Kaunsi entry sudharni hai? '+ch.map((x,j)=>(j+1)+' '+x.l).join(', ')+'.')}
function undo(){
  const i=S.ent.findIndex(x=>x.id===S.last);if(i<0)return say('Hatane ke liye kuch nahi.');
  const e=S.ent.splice(i,1)[0];S.last=S.ent.length?S.ent[S.ent.length-1].id:0;save();render();
  say(spoken(custById(e.cid))+' ka '+e.amt+' hata diya.')}

function run(raw){
  T0=performance.now();$('heard').textContent=raw;
  const t=toks(raw);
  if(pending&&pend(t))return;
  pending=null;$('choices').innerHTML='';
  const sl=segs(t).map(parseSeg),hasAmt=sl.some(s=>s.amt!==null);
  if(!hasAmt&&t.some(w=>UNDO.has(w)))return undo();
  const corr=t[0]&&(t[0].startsWith('nah')||['galat','matlab','sorry'].includes(t[0]));
  if(corr&&(hasAmt||t.some(w=>CR.has(w)||PAY.has(w))))return correct(sl,t);
  if(!hasAmt&&t.some(isQ))return query(t);
  if(hasAmt)return runEntries({sl,notes:[],done:[]},0,null,null);
  say('Samajh nahi aaya. Aise bolo: “Ramesh ka 340 udhaar” ya “Ramesh ka total?”')}

/* ---------- mic ---------- */
let rec=null,final='';
function mic(){
  if(rec){rec.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){T0=0;say('Is browser mein mic nahi chalta. Chrome (Android) kholo, ya neeche type karo.',[],true);return}
  try{speechSynthesis.cancel()}catch(e){}
  rec=new SR();rec.lang=$('lang').value;rec.interimResults=true;rec.continuous=false;final='';
  rec.onstart=()=>{$('mic').classList.add('on');$('hint').textContent='Sun raha hoon';wave(true);$('heard').textContent=''};
  rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;final=s;$('heard').textContent=s};
  rec.onerror=e=>{final='';T0=0;say(e.error==='not-allowed'||e.error==='service-not-allowed'?'Mic ki permission band hai. Page ko seedha Chrome tab mein kholo aur Allow karo, ya neeche type karo.':'Awaaz sunai nahi di ('+e.error+'). Dobara dabao.',[],true)};
  rec.onend=()=>{rec=null;$('mic').classList.remove('on');wave(false);$('hint').textContent=IDLE;if(final)run(final)};
  try{rec.start()}catch(e){rec=null}}

/* ---------- wire up ---------- */
$('mic').onclick=mic;
const send=()=>{const v=$('ti').value.trim();if(v){$('ti').value='';run(v)}};
$('go').onclick=send;$('ti').onkeydown=e=>{if(e.key==='Enter')send()};
$('choices').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.j)};
$('undo').onclick=()=>{T0=performance.now();undo()};
$('cl').onclick=e=>{const b=e.target.closest('.cust');if(!b)return;const c=S.cust.find(x=>x.id===+b.dataset.id);if(c){T0=performance.now();$('heard').textContent=c.name+' ka total?';answer(c)}};
$('addtog').onclick=()=>{const a=$('addbox');a.hidden=!a.hidden;if(!a.hidden)$('nn').focus()};
$('na').onclick=()=>{const n=$('nn').value.trim();if(!n)return;const c=addCust(n[0].toUpperCase()+n.slice(1),$('nt').value.trim());flash=[c.id];$('nn').value='';$('nt').value='';$('addbox').hidden=true;save();render();T0=0;say(n+' jod diya.',[],true)};
$('reset').onclick=()=>{seed();render();T0=0;say('Demo data wapas aa gaya.',[],true)};
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').setAttribute('aria-pressed',String(soundOn));$('snd').classList.toggle('off',!soundOn);if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}toast(soundOn?'Awaaz chalu':'Awaaz band')};
document.addEventListener('pointerdown',()=>{try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}},{once:true});
['Ramesh ka 340 udhaar, kal 200 diya tha','nahi, 430','Ramesh ka total?','Suresh ka dhai sau udhaar','Suresh ka total'].forEach(x=>{
  const b=document.createElement('button');b.textContent=x;b.onclick=()=>run(x);$('ex').appendChild(b)});
const vt=document.createElement('button');vt.textContent='Awaaz check';vt.onclick=()=>{T0=0;say('Namaste. Agar yeh sunai de raha hai, to awaaz theek hai.')};$('ex').appendChild(vt);
load();render();
})();
</script>
